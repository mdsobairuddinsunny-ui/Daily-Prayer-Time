<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f2f7fb">
  <title>নূর — নামাজের সময়সূচি ও আজানের সময়সূচি · বাংলাদেশ</title>

  <!-- Google Luxury Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Cinzel+Decorative:wght@700&family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --bg: #f2f7fb;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(184, 134, 11, 0.22);
      --gold-primary: #b8860b;
      --gold-deep: #8c6504;
      --gold-light: #dfb743;
      --gold-gradient: linear-gradient(135deg, #dfb743 0%, #b8860b 50%, #8c6504 100%);
      --emerald-accent: #047857;
      --text-main: #0c1e2e;
      --text-muted: #546e85;
      --shadow-luxury: 0 18px 45px rgba(12, 30, 46, 0.08);
      --shadow-glow: 0 0 30px rgba(212, 175, 55, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      background:
        radial-gradient(ellipse at 50% -5%, rgba(212, 175, 55, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 8% 40%, rgba(4, 120, 87, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 92% 70%, rgba(212, 175, 55, 0.14) 0%, transparent 50%),
        var(--bg);
      color: var(--text-main);
      font-family: 'Hind Siliguri', 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .app-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 80px;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 22px;
      border-bottom: 1.5px solid rgba(184, 134, 11, 0.2);
      margin-bottom: 24px;
    }

    .brand { display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .brand-crest {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--gold-gradient);
      display: grid;
      place-items: center;
      color: #ffffff;
      font-family: 'Amiri', serif;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(184, 134, 11, 0.35);
    }

    .brand-title h1 { font-size: 24px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    .brand-title p { font-size: 11px; letter-spacing: 0.18em; color: var(--text-muted); text-transform: uppercase; }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-lux {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--card-border);
      color: var(--gold-deep);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .btn-lux:hover { border-color: var(--gold-primary); transform: translateY(-2px); }

    .sync-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(4, 120, 87, 0.08);
      color: var(--emerald-accent);
      border: 1px solid rgba(4, 120, 87, 0.2);
      margin-bottom: 16px;
    }

    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; animation: breathe 2s infinite; }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .celestial-bar {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(244, 250, 255, 0.92));
      border: 1.5px solid rgba(184, 134, 11, 0.32);
      border-radius: 22px;
      padding: 18px 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-luxury);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .celestial-item { text-align: center; border-right: 1px solid rgba(184, 134, 11, 0.18); }
    .celestial-item:last-child { border-right: none; }
    .celestial-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .celestial-time { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; color: var(--gold-deep); }

    .tab-container { display: flex; background: rgba(255, 255, 255, 0.82); border: 1.5px solid var(--card-border); border-radius: 18px; padding: 6px; margin-bottom: 24px; gap: 8px; box-shadow: var(--shadow-luxury); }
    .tab-btn { flex: 1; padding: 14px 20px; border: none; border-radius: 14px; background: transparent; color: var(--text-muted); font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--gold-gradient); color: #ffffff; box-shadow: 0 6px 20px rgba(184, 134, 11, 0.32); }

    .schedule-grid { display: flex; flex-direction: column; gap: 12px; }
    .prayer-row {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 24px;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1.3fr;
      align-items: center;
      transition: all 0.28s ease;
      box-shadow: var(--shadow-luxury);
      backdrop-filter: blur(14px);
    }

    .prayer-row:hover { border-color: var(--gold-primary); transform: translateX(4px); background: #ffffff; }
    .name-bn { font-size: 22px; font-weight: 700; color: var(--text-main); }
    .sub-bn { font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .arabic-badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 30px; background: rgba(184, 134, 11, 0.08); border: 1.5px solid rgba(184, 134, 11, 0.28); color: var(--gold-deep); font-family: 'Amiri', serif; font-size: 19px; font-weight: bold; }
    .time-digits { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; color: var(--gold-deep); }
    .time-period { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; color: var(--text-muted); }

    .tools-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 28px; }
    .tool-card { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: 20px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
    .tool-card:hover { transform: translateY(-3px); }
    .tool-icon { font-size: 32px; margin-bottom: 8px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(12, 30, 46, 0.5); backdrop-filter: blur(12px); z-index: 1000; display: grid; place-items: center; padding: 20px; opacity: 0; pointer-events: none; transition: 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: #ffffff; border: 1.5px solid rgba(184, 134, 11, 0.35); border-radius: 24px; width: min(520px, 100%); padding: 28px; box-shadow: 0 25px 70px rgba(12, 30, 46, 0.2); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1.5px solid rgba(184, 134, 11, 0.15); padding-bottom: 12px; }

    /* Admin Panel Blue Ember Obsidian Theme */
    #adminModal .modal-box { background: radial-gradient(circle at 10% 10%, #0c1a30 0%, #030812 90%); border: 1.5px solid #38bdf8; color: #f1f5f9; }
    #adminModal .modal-head h3 { background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    #adminModal .form-control { width: 100%; padding: 12px; border-radius: 12px; background: #0f172a; border: 1px solid #38bdf8; color: #38bdf8; outline: none; margin-bottom: 10px; font-weight: 700; }
    .btn-cyber-save { width: 100%; padding: 14px; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none; font-weight: 800; cursor: pointer; margin-top: 10px; }

    @media (max-width: 768px) {
      .celestial-bar { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .celestial-item:nth-child(2) { border-right: none; }
      .prayer-row { grid-template-columns: 1fr 1.3fr; padding: 16px; }
      .col-arabic { display: none; }
      .tools-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <header>
      <div class="brand">
        <div class="brand-crest">ن</div>
        <div class="brand-title">
          <h1>নূর — আল-মিযান</h1>
          <p>CELESTIAL PRAYER INTELLIGENCE</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-lux" id="adminBtn">⚙ অ্যাডমিন</button>
      </div>
    </header>

    <div class="sync-status-badge">
      <span class="sync-dot"></span>
      <span id="syncText">Cloud Realtime Synced · BD</span>
    </div>

    <section class="celestial-bar">
      <div class="celestial-item"><div class="celestial-label">🌙 সাহরি শেষ</div><div class="celestial-time" id="timeSehri">--:--</div></div>
      <div class="celestial-item"><div class="celestial-label">☀️ সূর্যোদয়</div><div class="celestial-time" id="timeSunrise">--:--</div></div>
      <div class="celestial-item"><div class="celestial-label">🌇 সূর্যাস্ত</div><div class="celestial-time" id="timeSunset">--:--</div></div>
      <div class="celestial-item"><div class="celestial-label">✨ ইফতার শুরু</div><div class="celestial-time" id="timeIftar">--:--</div></div>
    </section>

    <div class="tab-container">
      <button class="tab-btn active" id="tabJamat">🕌 জামাত সময়</button>
      <button class="tab-btn" id="tabAzan">📢 আজান সময়</button>
    </div>

    <main class="schedule-grid" id="scheduleList"></main>

    <section class="tools-grid">
      <div class="tool-card" onclick="alert('Digital Compass loading...')"><span class="tool-icon">🧭</span><div class="tool-title">কিবলা কম্পাস</div></div>
      <div class="tool-card" id="tasbihBtn"><span class="tool-icon">📿</span><div class="tool-title">ডিজিটাল তাসবিহ</div></div>
      <div class="tool-card" onclick="alert('Dua of the day updated')"><span class="tool-icon">📜</span><div class="tool-title">আজকের হাদিস</div></div>
    </section>
  </div>

  <!-- Admin Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <div class="modal-head"><h3>⚡ MASTER COMMAND</h3><button class="close-btn" onclick="closeModal('adminModal')">✕</button></div>
      <div id="adminPinSection">
        <input type="password" class="form-control" id="adminPinInput" placeholder="মাস্টার পিন দিন (ডিফল্ট: 7860)">
        <button class="btn-cyber-save" id="pinSubmitBtn">🔓 অথেনটিকেশন</button>
      </div>
      <div id="adminEditorSection" style="display: none; max-height: 60vh; overflow-y: auto;">
        <div id="adminInputsList"></div>
        <button class="btn-cyber-save" id="saveGlobalBtn">⚡ PUBLISH TO CLOUD</button>
        <button class="btn-lux" style="width:100%; margin-top:10px; color:red;" id="changePinBtn">🔑 পিন পরিবর্তন</button>
      </div>
    </div>
  </div>

  <!-- Tasbih Modal -->
  <div class="modal-overlay" id="tasbihModal">
    <div class="modal-box">
      <div class="modal-head"><h3>ডিজিটাল তাসবিহ</h3><button class="close-btn" onclick="closeModal('tasbihModal')">✕</button></div>
      <div style="font-size: 70px; text-align: center; color: var(--gold-deep); font-weight: 800;" id="tCount">0</div>
      <button class="btn-cyber-save" style="height: 100px; font-size: 24px;" onclick="countT()">ট্যাপ করুন</button>
      <button class="btn-lux" style="width: 100%; margin-top: 10px;" onclick="resetT()">রিসেট</button>
    </div>
  </div>

  <script>
    const CLOUD_URL = "https://api.npoint.io/46dfb4c2ebf928e08d13";
    const DEFAULT_DATA = {
      celestial: { sehri: "04:35 AM", sunrise: "05:52 AM", sunset: "06:14 PM", iftar: "06:16 PM" },
      jamat: [
        {bn:"ফজর", ar:"الفجر", time:"05:15 AM", sub:"ভোর"}, {bn:"যোহর", ar:"الظهر", time:"01:15 PM", sub:"দুপুর"},
        {bn:"আসর", ar:"العصر", time:"04:45 PM", sub:"বিকাল"}, {bn:"মাগরিব", ar:"المغرب", time:"06:18 PM", sub:"সন্ধ্যা"},
        {bn:"এশা", ar:"العشاء", time:"08:00 PM", sub:"রাত"}, {bn:"জুমুআ", ar:"الجمعة", time:"01:30 PM", sub:"শুক্রবার"}
      ],
      azan: [
        {bn:"ফজর", ar:"الفجر", time:"04:42 AM", sub:"ওয়াক্ত শুরু"}, {bn:"যোহর", ar:"الظهر", time:"12:05 PM", sub:"ওয়াক্ত শুরু"},
        {bn:"আসর", ar:"العصر", time:"04:15 PM", sub:"ওয়াক্ত শুরু"}, {bn:"মাগরিব", ar:"المغرب", time:"06:14 PM", sub:"ওয়াক্ত শুরু"},
        {bn:"এশা", ar:"العشاء", time:"07:30 PM", sub:"ওয়াক্ত শুরু"}, {bn:"জুমুআ", ar:"الجمعة", time:"11:55 AM", sub:"ওয়াক্ত শুরু"}
      ]
    };
    
    // Hash for default pin: 7860
    const DEFAULT_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
    let dbData = DEFAULT_DATA;
    let activeTab = "jamat";

    async function hash(msg) {
      const buffer = new TextEncoder().encode(msg + "NOOR_SECURE_SALT_2025");
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function loadData() {
      try {
        const res = await fetch(CLOUD_URL);
        if(res.ok) dbData = await res.json();
      } catch(e) {}
      render();
    }

    function render() {
      document.getElementById("timeSehri").textContent = dbData.celestial.sehri;
      document.getElementById("timeSunrise").textContent = dbData.celestial.sunrise;
      document.getElementById("timeSunset").textContent = dbData.celestial.sunset;
      document.getElementById("timeIftar").textContent = dbData.celestial.iftar;

      const list = activeTab === "jamat" ? dbData.jamat : dbData.azan;
      document.getElementById("scheduleList").innerHTML = list.map(item => `
        <div class="prayer-row">
          <div class="col-bangla"><div class="name-bn">${item.bn}</div><div class="sub-bn">${item.sub}</div></div>
          <div class="col-arabic"><div class="arabic-badge"><span>${item.ar}</span></div></div>
          <div class="col-time"><span class="time-digits">${item.time.split(' ')[0]}</span><span class="time-period">${item.time.split(' ')[1]}</span></div>
        </div>
      `).join('');
    }

    document.getElementById("adminBtn").onclick = () => document.getElementById("adminModal").classList.add("active");
    document.getElementById("tabJamat").onclick = () => { activeTab="jamat"; render(); document.getElementById("tabJamat").classList.add("active"); document.getElementById("tabAzan").classList.remove("active"); };
    document.getElementById("tabAzan").onclick = () => { activeTab="azan"; render(); document.getElementById("tabAzan").classList.add("active"); document.getElementById("tabJamat").classList.remove("active"); };

    document.getElementById("pinSubmitBtn").onclick = async () => {
      const pin = document.getElementById("adminPinInput").value;
      const inputHash = await hash(pin);
      const masterHash = localStorage.getItem("noor.master_v3") || DEFAULT_HASH;
      if(inputHash === masterHash) {
        document.getElementById("adminPinSection").style.display = "none";
        document.getElementById("adminEditorSection").style.display = "block";
        buildInputs();
      } else { alert("ভুল পিন!"); }
    };

    function buildInputs() {
      let h = '';
      Object.keys(dbData.celestial).forEach(k => h += `<label>${k}</label><input class="form-control admin-c" data-key="${k}" value="${dbData.celestial[k]}">`);
      dbData.jamat.forEach((item, i) => h += `<label>${item.bn} Jamat</label><input class="form-control admin-j" data-idx="${i}" value="${item.time}">`);
      dbData.azan.forEach((item, i) => h += `<label>${item.bn} Azan</label><input class="form-control admin-a" data-idx="${i}" value="${item.time}">`);
      document.getElementById("adminInputsList").innerHTML = h;
    }

    document.getElementById("saveGlobalBtn").onclick = async () => {
      document.querySelectorAll(".admin-c").forEach(el => dbData.celestial[el.dataset.key] = el.value);
      document.querySelectorAll(".admin-j").forEach(el => dbData.jamat[el.dataset.idx].time = el.value);
      document.querySelectorAll(".admin-a").forEach(el => dbData.azan[el.dataset.idx].time = el.value);
      
      await fetch(CLOUD_URL, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(dbData) });
      alert("Published Globally!");
      location.reload();
    };

    document.getElementById("changePinBtn").onclick = async () => {
      const p = prompt("নতুন পিন কোড লিখুন:");
      if(p && p.length >= 4) {
        const newHash = await hash(p);
        localStorage.setItem("noor.master_v3", newHash);
        alert("পিন সফলভাবে পরিবর্তিত!");
      }
    };

    function closeModal(id) { document.getElementById(id).classList.remove("active"); }
    document.getElementById("tasbihBtn").onclick = () => document.getElementById("tasbihModal").classList.add("active");
    let tc = 0;
    function countT() { tc++; document.getElementById("tCount").textContent = tc; }
    function resetT() { tc = 0; document.getElementById("tCount").textContent = tc; }

    loadData();
  </script>
</body>
</html>
